[project]
name = "focusmate-v1"
license = "MIT"
version = "0.1.0"
description = "Goal-driven, human-in-the-loop algorithm learning system"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.19,<5", "PyYAML>=6,<7", "markdown-it-py>=3,<5", "docker>=7.2,<8", "pywin32>=306; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests/python"]
python_files = ["test_*.py"]
